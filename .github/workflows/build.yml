name: Build oxidns for MT7621 (mipsel)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: mipsel-unknown-linux-musl

      - name: Install cross
        run: |
          # 安装 cross 工具
          cargo install cross --git https://github.com/cross-rs/cross || true

      - name: Build with cross
        run: |
          # 针对 MT7621 的 MIPS32r2 架构进行性能优化
          export RUSTFLAGS="-C target-cpu=mips32r2"
          # 使用 cross 进行交叉编译
          cross build --release --target mipsel-unknown-linux-musl

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: oxidns-mipsel-unknown-linux-musl
          path: target/mipsel-unknown-linux-musl/release/oxidns
